services:
  api:
    build:
      context: ..
      dockerfile: build/package/Dockerfile
    image: go-hris:latest
    container_name: hris-api
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - APP_SERVER_PORT=8080
    restart: unless-stopped
    networks:
      - hris-network

  worker:
    image: go-hris:latest
    container_name: hris-worker
    depends_on:
      api:
        condition: service_started
    command: ["./myapp-worker"]
    environment:
      - APP_ENV=development
    restart: unless-stopped
    networks:
      - hris-network

networks:
  hris-network:
    driver: bridge
